<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fcff"/>
      <stop offset="45%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="glowA" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f8fcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="68%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2563eb" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.9"/>
  <!-- Abstract spatial wireframe room -->
  <g fill="none" stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1.2">
    <path d="M420 620 L960 380 L1500 620 L1500 920 L420 920 Z"/>
    <path d="M420 620 L420 920 M960 380 L960 720 M1500 620 L1500 920"/>
    <path d="M420 620 L960 720 L1500 620"/>
    <path d="M600 520 L960 320 L1320 520"/>
  </g>
  <!-- Floating nodes -->
  <circle cx="320" cy="280" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="1580" cy="340" r="5" fill="#ffffff" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="1240" cy="780" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="680" cy="860" r="4" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Soft scan rings -->
  <ellipse cx="960" cy="540" rx="280" ry="120" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.12"/>
  <ellipse cx="960" cy="540" rx="420" ry="180" fill="none" stroke="#93c5fd" stroke-width="0.8" stroke-opacity="0.1"/>
  <!-- Light particles (snow) -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="180" cy="140" r="2"/><circle cx="440" cy="90" r="1.5"/><circle cx="720" cy="160" r="2"/>
    <circle cx="1100" cy="120" r="1.8"/><circle cx="1450" cy="200" r="2"/><circle cx="1700" cy="80" r="1.5"/>
    <circle cx="260" cy="480" r="1.6"/><circle cx="540" cy="420" r="2"/><circle cx="880" cy="260" r="1.4"/>
    <circle cx="1320" cy="480" r="2"/><circle cx="1640" cy="520" r="1.7"/><circle cx="200" cy="820" r="2"/>
    <circle cx="520" cy="980" r="1.5"/><circle cx="900" cy="900" r="2"/><circle cx="1280" cy="960" r="1.8"/>
    <circle cx="1760" cy="880" r="2"/>
  </g>
</svg>
